<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Tabel</title>
    <style>
        table {
            border-collapse: collapse; 
            text-align: center; 
            margin-bottom: 20px; 
        }
        td {
            border: 1px solid black; 
            padding: 10px 30px;
        }
    </style>
</head>
<body>
    
    <table>
        <tr>
            <td>1,1</td>
            <td>1,2</td>
            <td>1,3</td>
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
            <td>2,3</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>

    <table>
        <tr>
            <td>1,1</td>
            <td colspan="2">colspan = 2</td>
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
            <td>2,3</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>

   <table>
        <tr>
            <td rowspan="3">rowspan = 3</td>
            <td colspan="2">colspan = 2</td>
        <tr>
            <td>2,2</td>
            <td>2,3</td>
        </tr>
        <tr>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>

</body>
</html>
